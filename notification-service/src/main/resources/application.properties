spring.application.name=notification-service

server.port=8500

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true


# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# MongoDB
#spring.data.mongodb.uri=mongodb://localhost:27017/notificationsDB

# Queue names
spring.rabbitmq.queue.ticketPurchased=ticket-purchased-queue
spring.rabbitmq.queue.reservationConfirmed=reservation-confirmed-queue


# Exchange name
spring.rabbitmq.exchange.notification=notification-exchange

spring.cloud.consul.discovery.enabled=false
